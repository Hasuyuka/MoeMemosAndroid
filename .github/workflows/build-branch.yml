name: Build (branch verification)

# 分支/PR 编译验证。与 build-signed-release-apk.yml 分工：
#   - 本 workflow 只验证「能不能编译」，不签名、不发 Release，任何分支都跑。
#   - 打 tag 时的签名发布仍由 build-signed-release-apk.yml 负责。
#
# 存在意义：本机没有 JDK / Android SDK，所有改动的编译正确性都靠这里把关。

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

# 刻意不监听 pull_request：push 已经为同一个 SHA 触发了运行，check run 挂在该 commit 上、
# PR 里照样可见。再监听 pull_request 只会让每个分支白跑一遍，浪费一半 CI 配额。

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK for native library stripping
        run: |
          ANDROID_TOOLS="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ -x "$ANDROID_TOOLS/android" ]]; then
            "$ANDROID_TOOLS/android" --no-metrics --sdk="$ANDROID_HOME" sdk install "ndk;28.2.13676358"
          else
            "$ANDROID_TOOLS/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358"
          fi

      - name: Compile debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_id }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report summary
        if: always()
        run: |
          {
            echo "### 分支编译验证"
            echo ""
            echo "- ref: \`${GITHUB_REF_NAME}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- job 结果: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
