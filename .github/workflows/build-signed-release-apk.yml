name: Build Signed Release APK

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Validate tag format
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta)\.[0-9]+)?$ ]]; then
            echo "Tag '$TAG' is not supported. Expected formats: 0.9.0, 0.9.0-alpha.0, or 0.9.0-beta.0"
            exit 1
          fi

      # 版本号的唯一来源就是 tag。之前 tag 只用于重命名 APK，
      # 而 versionName 来自 app/build.gradle 里的硬编码，两者会脱节——
      # 曾出现「tag 2.0.6、APK 内声明 2.0.5」的名不符实产物。
      - name: Compute version from tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION_NAME="${TAG#v}"

          CORE="${VERSION_NAME%%-*}"
          PRE=""
          if [[ "$VERSION_NAME" == *-* ]]; then PRE="${VERSION_NAME#*-}"; fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          BASE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if (( BASE > 2100000 )); then
            echo "版本号过大，会超出 Android versionCode 上限: $CORE" >&2
            exit 1
          fi

          # 编码规则：BASE * 1000 + 阶段 * 100 + 序号
          #   阶段: alpha=0, beta=1, 正式=2 —— 保证同版本内 alpha < beta < 正式，
          #   且下一个版本的 alpha 一定大于上一个版本的正式版（单调递增）。
          if [[ -z "$PRE" ]]; then
            STAGE=2; NUM=0
          elif [[ "$PRE" == alpha.* ]]; then
            STAGE=0; NUM="${PRE#alpha.}"
          elif [[ "$PRE" == beta.* ]]; then
            STAGE=1; NUM="${PRE#beta.}"
          else
            echo "不支持的预发布后缀: $PRE" >&2
            exit 1
          fi
          if (( NUM > 99 )); then
            echo "预发布序号必须 <= 99，当前为 $NUM" >&2
            exit 1
          fi

          VERSION_CODE=$((BASE * 1000 + STAGE * 100 + NUM))
          {
            echo "versionName=$VERSION_NAME"
            echo "versionCode=$VERSION_CODE"
          } >> "$GITHUB_ENV"
          echo "tag=$TAG -> versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK for native library stripping
        run: |
          ANDROID_TOOLS="$ANDROID_HOME/cmdline-tools/latest/bin"
          if [[ -x "$ANDROID_TOOLS/android" ]]; then
            "$ANDROID_TOOLS/android" --no-metrics --sdk="$ANDROID_HOME" sdk install "ndk;28.2.13676358"
          else
            "$ANDROID_TOOLS/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358"
          fi

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" ]]; then
            echo "Missing secret: ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.keystore"

      - name: Build signed release APK (universal)
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          for var_name in ANDROID_SIGNING_STORE_FILE ANDROID_SIGNING_STORE_PASSWORD ANDROID_SIGNING_KEY_ALIAS ANDROID_SIGNING_KEY_PASSWORD; do
            if [[ -z "${!var_name}" ]]; then
              echo "Missing required signing value: ${var_name}"
              exit 1
            fi
          done
          ./gradlew :app:assembleRelease \
            -PappVersionName="$versionName" \
            -PappVersionCode="$versionCode"

      # 最后一道闸门：真的去读刚构建出来的 APK，而不是相信构建配置。
      # 这条断言就是用来堵住「tag 与 APK 内版本脱节」那类事故的。
      - name: Verify APK version matches the tag
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK" ]]; then
            echo "::error::找不到 APK: $APK"
            exit 1
          fi

          TOOL=""
          for name in aapt aapt2; do
            candidate="$(find "$ANDROID_HOME/build-tools" -name "$name" -type f 2>/dev/null | sort -V | tail -1 || true)"
            if [[ -n "$candidate" ]]; then TOOL="$candidate"; break; fi
          done
          if [[ -z "$TOOL" ]]; then
            echo "::error::在 \$ANDROID_HOME/build-tools 下找不到 aapt/aapt2"
            exit 1
          fi
          echo "使用 $TOOL"

          BADGING="$("$TOOL" dump badging "$APK" | head -1)"
          echo "$BADGING"
          GOT_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")"
          GOT_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")"

          echo "APK 内声明 : versionName=$GOT_NAME versionCode=$GOT_CODE"
          echo "tag 期望值 : versionName=$versionName versionCode=$versionCode"

          if [[ "$GOT_NAME" != "$versionName" || "$GOT_CODE" != "$versionCode" ]]; then
            echo "::error::APK 内声明的版本与 tag 不一致，拒绝发布这个包"
            exit 1
          fi
          echo "✅ 版本一致"

      - name: Rename APK with tag
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -f "$APK_PATH" ]]; then
            echo "APK not found at $APK_PATH"
            exit 1
          fi
          cp "$APK_PATH" "moememos-v${GITHUB_REF_NAME}.apk"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moememos-v${{ github.ref_name }}
          path: moememos-v${{ github.ref_name }}.apk

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: moememos-v${{ github.ref_name }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
