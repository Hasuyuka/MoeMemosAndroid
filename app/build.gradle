plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseSigningStoreFile = System.getenv("ANDROID_SIGNING_STORE_FILE")
def releaseSigningStorePassword = System.getenv("ANDROID_SIGNING_STORE_PASSWORD")
def releaseSigningKeyAlias = System.getenv("ANDROID_SIGNING_KEY_ALIAS")
def releaseSigningKeyPassword = System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
def hasReleaseSigning = [
    releaseSigningStoreFile,
    releaseSigningStorePassword,
    releaseSigningKeyAlias,
    releaseSigningKeyPassword
].every { it != null && !it.trim().isEmpty() }

// 逃生舱：只想到本地验证编译、接受未签名产物时用 -PallowUnsignedRelease。
def allowUnsignedRelease = project.hasProperty("allowUnsignedRelease")

// 版本号不再硬编码：CI 从 git tag 推导后通过 -PappVersionName / -PappVersionCode 注入。
//
// 起因是一次真实事故：release 标题与 APK 文件名都是 2.0.6，但 APK 内部声明的
// versionName 却是 2.0.5（因为 tag 只被用于文件名，版本号仍来自这里的硬编码）。
// 两者脱节会产出「名不符实」的安装包，用户装到的版本与看到的版本不一致。
// 现在版本只有一个来源：tag。本地不带参数构建时回退到开发默认值。
def appVersionName = "0.0.0-dev"
def appVersionNameProperty = project.findProperty("appVersionName")
if (appVersionNameProperty != null && !appVersionNameProperty.toString().trim().isEmpty()) {
    appVersionName = appVersionNameProperty.toString().trim()
}
def appVersionCode = 1
def appVersionCodeProperty = project.findProperty("appVersionCode")
if (appVersionCodeProperty != null && !appVersionCodeProperty.toString().trim().isEmpty()) {
    appVersionCode = appVersionCodeProperty.toString().trim().toInteger()
}

android {
    compileSdk = 37
    // Provides llvm-strip for native libraries bundled by AndroidX.
    ndkVersion = '28.2.13676358'

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

    defaultConfig {
        applicationId = "me.mudkip.moememos"
        minSdk = 26
        targetSdk = 37
        versionCode = appVersionCode
        versionName = appVersionName

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    testOptions {
        unitTests {
            // Robolectric 需要 AGP 提供合并后的 manifest 与资源，才能在没有设备的 JVM 测试里
            // 把 Android 框架跑起来——DAO 行为测试依赖这一点。
            //
            // 注意：这里的构建脚本是 Groovy DSL，属性名是 includeAndroidResources；
            // Kotlin DSL（build.gradle.kts）里才写作 isIncludeAndroidResources。
            includeAndroidResources = true
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseSigningStoreFile)
                storePassword releaseSigningStorePassword
                keyAlias releaseSigningKeyAlias
                keyPassword releaseSigningKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            crunchPngs = false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose = true
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    namespace = 'me.mudkip.moememos'
}

// 缺签名变量时，上面的 signingConfigs.release 块体不会执行、release buildType 也不会
// 绑定签名，Gradle 会「成功」产出一个未签名的 release APK。这种静默降级很危险：
// 产物看着像正式包，装到设备上却会被拒绝，而构建日志里没有任何失败信号。
// 这里让显式的 release 打包任务直接失败，并说明缺了什么。
// CI 侧（build-signed-release-apk.yml）另有 shell 层校验，本地此前完全没有保护。
tasks.matching { it.name in ['assembleRelease', 'bundleRelease'] }.configureEach {
    doFirst {
        if (!hasReleaseSigning && !allowUnsignedRelease) {
            throw new GradleException(
                "缺少发布签名配置，拒绝产出未签名 release 包。\n" +
                    "需要以下环境变量全部非空：\n" +
                    "  ANDROID_SIGNING_STORE_FILE\n" +
                    "  ANDROID_SIGNING_STORE_PASSWORD\n" +
                    "  ANDROID_SIGNING_KEY_ALIAS\n" +
                    "  ANDROID_SIGNING_KEY_PASSWORD\n" +
                    "若只是想在本地验证编译、接受未签名产物，请加 -PallowUnsignedRelease。"
            )
        }
    }
}

dependencies {
